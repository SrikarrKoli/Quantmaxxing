name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Server smoke test
        working-directory: packages/server
        run: |
          printf 'TOKEN_SECRET=%s\nAUTH_EMULATOR=true\nDISABLE_RATE_LIMITS=true\n' "$(openssl rand -hex 32)" > .dev.vars
          npx wrangler d1 migrations apply quantmaxxing --local
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/health && break; sleep 1; done
          node ../../scripts/server-smoke.mjs || (cat wrangler.log; exit 1)
