name = "quantmaxxing-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[observability]
enabled = true

[vars]
FIREBASE_PROJECT_ID = "quantmaxxing-94ac5"
ALLOWED_ORIGINS = "https://quantmaxxing.web.app,https://quantmaxxing.firebaseapp.com,http://localhost:5173,http://127.0.0.1:5173"
AUTH_EMULATOR = "false"
# A lone queued player gets a labeled bot after this wait. Set to "0" to turn bot fill off.
BOT_FILL_CASUAL_MS = "8000"
BOT_FILL_RANKED_MS = "15000"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

[[d1_databases]]
binding = "DB"
database_name = "quantmaxxing"
database_id = "d8c250c3-ca59-4e97-bc9b-63d1ca1447d8"
migrations_dir = "migrations"
