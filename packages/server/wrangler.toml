name = "quantmaxxing-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "quantmaxxing-94ac5"
ALLOWED_ORIGINS = "https://quantmaxxing.web.app,https://quantmaxxing.firebaseapp.com,http://localhost:5173,http://127.0.0.1:5173"
AUTH_EMULATOR = "false"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]

[[d1_databases]]
binding = "DB"
database_name = "quantmaxxing"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
